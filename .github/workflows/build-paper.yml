name: RID-UFE Robust Paper Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc texlive texlive-latex-extra texlive-fonts-recommended

    - name: Find latest paper.md
      id: findpaper
      run: |
        echo "Searching for paper.md..."

        FILE=$(find . -type f -name "paper.md" | sort | tail -n 1)

        echo "Found: $FILE"

        if [ -z "$FILE" ]; then
          echo "ERROR: No paper.md found in repo"
          exit 1
        fi

        echo "paper_path=$FILE" >> $GITHUB_OUTPUT

    - name: Build PDF safely
      run: |
        mkdir -p output

        echo "Using file: ${{ steps.findpaper.outputs.paper_path }}"

        pandoc "${{ steps.findpaper.outputs.paper_path }}" \
          -o output/paper.pdf \
          --pdf-engine=xelatex

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rid-ufe-paper
        path: output/paper.pdf
