name: RID-UFE Paper Build (Robust LaTeX)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install Pandoc + FULL LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc texlive-full

    - name: Locate report.md
      id: find
      run: |
        FILE=$(find ./experiments -type f -name "report.md" | sort | tail -n 1)

        echo "FOUND: $FILE"

        if [ -z "$FILE" ]; then
          echo "ERROR: No report.md found"
          exit 1
        fi

        echo "file=$FILE" >> $GITHUB_OUTPUT

    - name: Build PDF
      run: |
        mkdir -p output

        pandoc "${{ steps.find.outputs.file }}" \
          -o output/paper.pdf \
          --pdf-engine=xelatex

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rid-ufe-paper
        path: output/paper.pdf
