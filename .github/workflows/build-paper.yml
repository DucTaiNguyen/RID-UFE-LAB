name: RID-UFE Paper Build (Single Robust Pipeline)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc texlive texlive-latex-extra texlive-fonts-recommended

    - name: Debug repo structure
      run: |
        echo "=== FILE TREE ==="
        find . -type f -name "*.md"

    - name: Locate report file (ONLY SOURCE)
      id: find
      run: |
        FILE=$(find ./experiments -type f -name "report.md" | sort | tail -n 1)

        echo "FOUND: $FILE"

        if [ -z "$FILE" ]; then
          echo "ERROR: No report.md found in experiments/"
          exit 1
        fi

        echo "file=$FILE" >> $GITHUB_OUTPUT

    - name: Build PDF (ROBUST)
      run: |
        mkdir -p output

        pandoc "${{ steps.find.outputs.file }}" \
          -o output/paper.pdf \
          --pdf-engine=xelatex

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rid-ufe-paper
        path: output/paper.pdf
