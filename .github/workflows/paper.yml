name: Build LaTeX Paper

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended

      - name: Compile paper
        run: |
          cd paper
          pdflatex main.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: research-paper
          path: paper/main.pdf
