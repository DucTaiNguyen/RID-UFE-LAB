- name: Create paper directory
        run: |
          mkdir -p paper

      - name: Generate LaTeX (safe)
        run: |
          cat > paper/main.tex << 'EOF'
\documentclass{article}
\begin{document}

\title{RID-UFE Research Report}
\maketitle

\section{Experiment}
This is a safe fallback paper generated by CI.

\section{Result}
System executed successfully without external dependencies.

\end{document}
EOF

      - name: Install LaTeX minimal
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base

      - name: Compile LaTeX (FORCED SAFE)
        run: |
          cd paper
          pdflatex -interaction=nonstopmode main.tex
          ls -la
          if [ ! -f main.pdf ]; then echo "PDF MISSING"; exit 1; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-paper
          path: paper/main.pdf
