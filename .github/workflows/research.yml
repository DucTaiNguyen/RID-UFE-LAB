name: RID-UFE Research Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create paper directory
        run: mkdir -p paper

      - name: Generate LaTeX
        run: |
          cat > paper/main.tex <<'EOF'
          \documentclass{article}
          \begin{document}
          Hello RID-UFE
          \end{document}
          EOF

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base

      - name: Build PDF
        run: |
          cd paper
          pdflatex main.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: research-paper
          path: paper/main.pdf
