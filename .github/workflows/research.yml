name: RID-UFE Research Pipeline

on:
push:
branches:
- main
workflow_dispatch:

jobs:
research:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Create folders
    run: |
      mkdir -p paper
      mkdir -p results

  - name: Run experiment
    run: |
      python experiments/bitcoin_report.py

  - name: Generate LaTeX paper
    run: |
      python generate_paper.py

  - name: Verify generated files
    run: |
      ls -la
      ls -la paper

  - name: Install LaTeX
    run: |
      sudo apt-get update
      sudo apt-get install -y texlive-latex-base

  - name: Build PDF
    run: |
      cd paper
      pdflatex -interaction=nonstopmode main.tex
      ls -la

  - name: Upload PDF artifact
    uses: actions/upload-artifact@v4
    with:
      name: research-paper
      path: paper/main.pdf
