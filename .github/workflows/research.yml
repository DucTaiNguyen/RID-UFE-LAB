name: RID-UFE Research Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install numpy pandas matplotlib requests fastapi uvicorn jinja2

      - name: Run experiments
        run: |
          python experiments/run_real.py

      - name: Generate LaTeX paper
        run: |
          python run_real.py

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra

      - name: Build PDF
        run: |
          cd paper
          pdflatex main.tex
          pdflatex main.tex

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-paper
          path: paper/main.pdf
