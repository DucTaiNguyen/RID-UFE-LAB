name: RID-UFE Research Pipeline

on:
  push:
    branches: [ main ]

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install numpy pandas matplotlib jinja2

      - name: Run safe experiment
        run: |
          mkdir -p results
          echo "accuracy=0.85" > results/out.txt

      - name: Generate LaTeX
        run: |
          mkdir -p paper
          echo "\documentclass{article}\begin{document}Hello RID-UFE\end{document}" > paper/main.tex

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base

      - name: Build PDF
        run: |
          cd paper
          pdflatex main.tex

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/main.pdf
