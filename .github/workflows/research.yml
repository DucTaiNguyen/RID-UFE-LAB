- name: Create LaTeX file (SAFE)
        run: |
          mkdir -p paper
          echo "\documentclass{article}\begin{document}RID-UFE PAPER OK\end{document}" > paper/main.tex

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base

      - name: Build PDF (DEBUG MODE)
        run: |
          cd paper
          ls -la
          pdflatex -interaction=nonstopmode main.tex || true
          ls -la

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/*.pdf
