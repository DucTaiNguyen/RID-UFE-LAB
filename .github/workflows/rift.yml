name: RIFT CI

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Install deps
        run: pip install numpy pandas yfinance matplotlib

      - name: Run system
        run: python main.py
